type: custom:plotly-graph
title: Target Positions
refresh_interval: 1
hours_to_show: current_day
layout:
  height: 230
  margin:
    l: 50
    r: 20
    t: 20
    b: 40
  showlegend: true
  xaxis:
    dtick: 100
    gridcolor: RGBA(200,200,200,0.15)
    zerolinecolor: RGBA(200,200,200,0.15)
    type: number
    fixedrange: true
    range:
      - 600
      - -600
  yaxis:
    dtick: 100
    gridcolor: RGBA(200,200,200,0.15)
    zerolinecolor: RGBA(200,200,200,0.15)
    scaleanchor: x
    scaleratio: 1
    fixedrange: true
    range:
      - 600
      - 0
entities:
  - entity: ""
    name: Target 1
    marker:
      size: 12
    line:
      shape: spline
      width: 5
    x:
      - $ex hass.states["sensor.hlk_presence_p0x"].state
    "y":
      - $ex hass.states["sensor.hlk_presence_p0y"].state
  - entity: ""
    name: Target 2
    marker:
      size: 12
    line:
      shape: spline
      width: 5
    x:
      - $ex hass.states["sensor.hlk_presence_p1x"].state
    "y":
      - $ex hass.states["sensor.hlk_presence_p1y"].state
  - entity: ""
    name: Target 3
    marker:
      size: 12
    line:
      shape: spline
      width: 5
    x:
      - $ex hass.states["sensor.hlk_presence_p2x"].state
    "y":
      - $ex hass.states["sensor.hlk_presence_p2y"].state
  - entity: ""
    name: Zone 1
    mode: lines
    fill: toself
    fillcolor: RGBA(20,200,0,0.10)
    line:
      color: RGBA(20,200,0,0.5)
      width: 2
    x:
      - -247
      - -247
      - 303
      - 303
      - -247
    "y":
      - 20
      - 110
      - 110
      - 20
      - 20
  - entity: ""
    name: Zone 2
    mode: lines
    fill: toself
    fillcolor: RGBA(200,0,255,0.10)
    line:
      color: RGBA(200,0,255,0.5)
      width: 2
    x:
      - -15
      - -15
      - 245
      - 245
      - -15
    "y":
      - 455
      - 535
      - 535
      - 455
      - 455
  - entity: ""
    name: Coverage
    mode: lines
    fill: tonexty
    fillcolor: rgba(168,216,234,0.15)
    line:
      shape: line
      width: 1
      dash: dot
    x:
      - 0
      - $ex 600 * Math.sin((2 * Math.PI)/360 * 60)
      - 450
      - 400
      - 300
      - 200
      - 100
      - 0
      - -100
      - -200
      - -300
      - -400
      - -450
      - $ex -600 * Math.sin((2 * Math.PI)/360 * 60)
      - 0
    "y":
      - 0
      - $ex 600 * Math.cos((2 * Math.PI)/360 * 60)
      - $ex Math.sqrt(600**2 - 450**2)
      - $ex Math.sqrt(600**2 - 400**2)
      - $ex Math.sqrt(600**2 - 300**2)
      - $ex Math.sqrt(600**2 - 200**2)
      - $ex Math.sqrt(600**2 - 100**2)
      - 600
      - $ex Math.sqrt(600**2 - 100**2)
      - $ex Math.sqrt(600**2 - 200**2)
      - $ex Math.sqrt(600**2 - 300**2)
      - $ex Math.sqrt(600**2 - 400**2)
      - $ex Math.sqrt(600**2 - 450**2)
      - $ex 600 * Math.cos((2 * Math.PI)/360 * 60)
      - 0
raw_plotly_config: true
